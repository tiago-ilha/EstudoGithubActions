name: CI/CD

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main, develop"]

jobs:
  Release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

    #- name: Test
    #  run: dotnet test --no-build --verbosity normal

  Homologacao:
    name: "Homologação"
    runs-on: ubuntu-latest
    needs: Release
    steps:
      - name: Deploy to Homologação
        run: echo "Deploying to Homologação"

  Producao:
    name: "Produção"
    runs-on: ubuntu-latest
    needs: Homologacao
    environment: 
      name: manual-approval
    steps:
      - name: Deploy to Produção
        run: echo "Deploying to Produção"
